    const sc = mapSubcat(raw.subcategory_id);
    rules.push({
      id, name: raw.name.trim(), type: raw.type, amount_original: amount,
      currency: raw.currency === 'USD' ? 'USD' : 'UZS',
      category_id: categoryId, subcategory_id: sc && subcatIds.has(sc) ? sc : null,
      note: typeof raw.note === 'string' ? raw.note : '',
      period, day_of_month: period === 'monthly' ? dom : null, day_of_week: period === 'weekly' ? dow : null,
      next_due: nextDue, is_active: raw.is_active !== false,
    });
  }

  // Операции: суммы больше нуля, корректная дата, ссылки только на существующие записи
  const seenTxIds = new Set();
  const txs = [];
  for (const raw of arr(d.transactions)) {
    if (!raw || !['income', 'expense'].includes(raw.type) || !isValidISO(raw.occurred_on)) continue;
    const categoryId = mapCat(raw.category_id);
    if (!catIds.has(categoryId)) continue;
    const amountUzs = round2(num(raw.amount_uzs, 0));
    if (!(amountUzs > 0 && amountUzs < MAX_UZS)) continue;
    const id = okId(raw.id) ? raw.id : uid();
    if (seenTxIds.has(id)) continue;
    seenTxIds.add(id);
    const orig = round2(num(raw.amount_original, 0));
    const rt = num(raw.rate, 0);
    const sc = mapSubcat(raw.subcategory_id);
    const row = {
      id, type: raw.type, amount_uzs: amountUzs,
      amount_original: orig > 0 && orig < MAX_UZS ? orig : amountUzs,
      currency: raw.currency === 'USD' ? 'USD' : 'UZS',
      rate: rt > 0 && rt < MAX_RATE ? rt : rate(),
      category_id: categoryId,
      subcategory_id: sc && subcatIds.has(sc) ? sc : null,
      note: typeof raw.note === 'string' ? raw.note : '',
      occurred_on: raw.occurred_on,
    };
    if (typeof raw.created_at === 'string' && !Number.isNaN(Date.parse(raw.created_at))) row.created_at = raw.created_at;
    txs.push(row);
  }

  await db.upsertMany('categories', cats);
  await db.upsertMany('subcategories', subs);
  await db.upsertMany('subscriptions', subsc);
  if (rules.length && state.recurringReady) await db.upsertMany('recurring_rules', rules);
  await db.upsertMany('transactions', txs);

  if (d.settings && typeof d.settings === 'object') {
    const s = {};
    const r0 = num(d.settings.usd_rate, 0);
    if (r0 > 0 && r0 < MAX_RATE) s.usd_rate = r0;
    if (isValidISO(d.settings.usd_rate_updated_at)) s.usd_rate_updated_at = d.settings.usd_rate_updated_at;
    const inc = num(d.settings.expected_income, -1);
    if (inc >= 0 && inc < MAX_UZS) s.expected_income = round2(inc);
    const goal = num(d.settings.savings_goal_pct, -1);
    if (goal >= 0 && goal <= 100) s.savings_goal_pct = round2(goal);
    if (d.settings.theme === 'dark' || d.settings.theme === 'light') s.theme = d.settings.theme;
    if (d.settings.language === 'ru' || d.settings.language === 'en') s.language = d.settings.language;
    if (Object.keys(s).length) await db.updateSettings(s);
  }
  await loadAll();
}

/* =====================================================================
   14. ОБРАБОТЧИКИ ДЕЙСТВИЙ (делегирование по data-action)
   ===================================================================== */
const ACTIONS = {
  tab: (b) => setTab(b.dataset.tab),
  refresh: (b) => refreshData(b.id === 'btn-refresh' ? b : $('#btn-refresh')),
  'toggle-theme': () => applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'),
  'set-theme': (b) => applyTheme(b.dataset.theme),
  'set-lang': (b) => applyLang(b.dataset.lang),
  'quick-add': () => { if (!state.loading) openTxSheet(); },
  'edit-tx': (b) => { const t = state.transactions.find((x) => x.id === b.dataset.id); if (t) openTxSheet(t); },
  'period-prev': () => shiftPeriod(-1),
  'period-next': () => shiftPeriod(1),
  'period-toggle': () => { state.showRange = !state.showRange; renderDashboard(); },
  'period-month': () => { const t = parseISO(todayISO()); state.period = { kind: 'month', y: t.y, m: t.m }; state.showRange = false; renderDashboard(); },
  'period-apply': () => {
    let from = $('#range-from').value, to = $('#range-to').value;
    if (!isValidISO(from) || !isValidISO(to)) return toast(t('err.bothDates'), 'err');
    if (from > to) [from, to] = [to, from];
    if (daysBetween(from, to) > 366 * 3) return toast(t('err.threeYears'), 'err');
    state.period = { kind: 'range', from, to }; renderDashboard();
  },
  'add-sub': () => openSubEditor(null),
  'edit-sub': (b) => { const s = state.subscriptions.find((x) => x.id === b.dataset.id); if (s) openSubEditor(s); },
  'pay-sub': (b) => { const s = state.subscriptions.find((x) => x.id === b.dataset.id); if (s) openPaySheet(s); },
  'period-kind': (b) => setPeriodKind(b.dataset.kind),
  'export-year-csv': exportYearCSV,
  'attn-close': () => { state.attentionDismissed = true; renderAttention(); },
  'add-rule': () => { if (state.recurringReady) openRuleEditor(null); else toast(t('rule.tableMissing'), 'err'); },
  'edit-rule': (b) => { const x = ruleById(b.dataset.id); if (x) openRuleEditor(x); },
  'post-rule': (b) => { const x = ruleById(b.dataset.id); if (x) openPostRuleSheet(x); },
  'calc-mode': (b) => setCalcMode(b.dataset.mode),
  'calc-key': (b) => calcInput(b.dataset.key),
  'calc-insert': () => { const v = calcValue(); if (v > 0) openTxSheet({ amount: round2(v), currency: 'UZS' }); else toast(t('calc.needPositive'), 'info'); },
  // Сырое значение через calcRaw: результат с ошибкой хранится служебной меткой ERR,
  // а не локализованным словом, и не зависит от языка интерфейса
  'calc-hist': (b) => { const h = state.calc.history[Number(b.dataset.i)]; if (!h) return; Object.assign(state.calc, { display: calcRaw(h.result), prev: null, op: null, waiting: false, evaluated: true, expr: h.line.split(' = ')[0] + ' =' }); updateCalcDisplay(); },
  'calc-clear-history': () => { state.calc.history = []; updateCalcDisplay(); },
  'pct-mode': (b) => setPctMode(b.dataset.mode),
  'pct-dir': (b) => { state.pct.dir = b.dataset.dir; $$('#pct-dir-seg button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.dir === state.pct.dir))); updatePct(); },
  'pct-insert': () => { const r = pctCompute(); if (r && !r.isPct && r.value > 0) openTxSheet({ amount: round2(r.value), currency: 'UZS' }); else toast(r && r.isPct ? t('pct.cantInsert') : t('pct.enterFirst'), 'info'); },
  'pct-preset-cat': () => {
    const id = $('#pct-preset-cat').value; const { from, to } = periodRange(); const txs = txInRange(from, to);
    const total = totals(txs).expense; const part = spentByCategory(txs).get(id) || 0;
    if (total <= 0) return toast(t('pct.noExpenses'), 'info');
    setPctValues('b', part, total);
  },
  'pct-preset-income': () => {
    const { from, to, isMonth } = periodRange(); const { income, expense } = totals(txInRange(from, to));
    const base = income > 0 ? income : (isMonth ? state.settings.expected_income : 0);
    if (base <= 0) return toast(t('pct.noIncome'), 'info');
    setPctValues('b', expense, base);
  },
  'save-settings': saveSettings,
  'add-cat': () => openCategoryEditor(null),
  'edit-cat': (b) => { const c = catById(b.dataset.id); if (c) openCategoryEditor(c); },
  'set-cat-type': (b) => { state.settingsCatType = b.dataset.type; renderSettings(); },
  'export-csv': exportCSV,
  'export-json': exportJSON,
  'import-json': () => $('#import-file').click(),
  logout,
};
function shiftPeriod(n) {
  const p = state.period;
  if (p.kind === 'year') { state.period = { kind: 'year', y: p.y + n }; renderDashboard(); return; }
  let { y, m } = p.kind === 'month' ? p : parseISO(p.from);
  ({ y, m } = addMonths(y, m, n));
  state.period = { kind: 'month', y, m };
  renderDashboard();
}
// Переключение режима дашборда: месяц или год. При возврате из года открывается последний
// просмотренный месяц этого года, иначе текущий месяц или январь
function setPeriodKind(kind) {
  const p = state.period, today = parseISO(todayISO());
  if (kind === 'year') {
    if (p.kind === 'month') state.lastMonth = { y: p.y, m: p.m };
    state.period = { kind: 'year', y: p.kind === 'range' ? parseISO(p.from).y : p.y };
  } else if (p.kind === 'year') {
    const lm = state.lastMonth && state.lastMonth.y === p.y ? state.lastMonth : (p.y === today.y ? { y: today.y, m: today.m } : { y: p.y, m: 1 });
    state.period = { kind: 'month', y: lm.y, m: lm.m };
  } else if (p.kind === 'range') {
    const f0 = parseISO(p.from);
    state.period = { kind: 'month', y: f0.y, m: f0.m };
  }
  state.showRange = false;
  renderDashboard();
}
function setPctValues(mode, x, y) {
  state.pct.x = String(round2(x)); state.pct.y = String(round2(y));
  $('#pct-x').value = fmtNum(x, { maxFrac: 2 }); $('#pct-y').value = fmtNum(y, { maxFrac: 2 });
  setPctMode(mode);
  const smooth = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  $('#pct-result').scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'nearest' });
}
async function saveSettings(b) {
  if (b.disabled || sync.pending.has('settings:1')) return;
  const r = Math.round(parseAmount($('#set-rate').value) * 10000) / 10000, inc = parseAmount($('#set-income').value), g = parseAmount($('#set-goal').value);
  if (!Number.isFinite(r) || r <= 0) return toast(t('set.errRate'), 'err');
  if (!Number.isFinite(inc) || inc < 0) return toast(t('set.errIncome'), 'err');
  if (!Number.isFinite(g) || g < 0 || g > 100) return toast(t('set.errGoal'), 'err');
  const patch = { usd_rate: r, expected_income: round2(inc), savings_goal_pct: round2(g) };
  if (r !== state.settings.usd_rate) patch.usd_rate_updated_at = todayISO();
  b.disabled = true;
  const draft = JSON.stringify(sync.settingsDraft);
  try {
    await db.updateSettings(patch);
    if (draft === JSON.stringify(sync.settingsDraft)) { pwa.settingsDirty = false; sync.settingsDraft = null; fillSettingsForm(); }
    await saveSnapshot(); toast(t('set.saved'));
  }
  catch (e) { toast(errMsg(e), 'err'); }
  finally { b.disabled = false; }
}

function bindGlobalHandlers() {
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-action]');
    if (!b || b.disabled) return;
    const h = ACTIONS[b.dataset.action];
    if (!h) return;
    e.preventDefault();
    try { const r = h(b, e); if (r && typeof r.catch === 'function') r.catch((err) => toast(errMsg(err), 'err')); }
    catch (err) { toast(errMsg(err), 'err'); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeTopOverlay(); return; }
    // Клавиатура для калькулятора, когда фокус не в поле ввода
    if (!state.session || state.tab !== 'calculator' || openOverlays || $('#calc-std')?.hidden) return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    const map = { Enter: '=', '=': '=', Backspace: 'back', Delete: 'C', ',': '.', '.': '.', '%': '%', '+': '+', '-': '-', '*': '*', '/': '/', x: '*', ':': '/' };
    if (/^[0-9]$/.test(e.key)) { calcInput(e.key); e.preventDefault(); }
    else if (map[e.key]) { calcInput(map[e.key]); e.preventDefault(); }
  });
  $('#login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('#login-email').value.trim(), password = $('#login-password').value;
    const err = $('#login-error'); const btn = $('#login-submit');
    if (btn.disabled) return;
    if (!email || !password) { err.textContent = t('auth.enterBoth'); err.hidden = false; return; }
    err.hidden = true; btn.disabled = true; btn.textContent = t('auth.signingIn');
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await enterApp(data.session);
    } catch (ex) { err.textContent = errMsg(ex); err.hidden = false; }
    finally { btn.disabled = false; btn.textContent = t('auth.signIn'); }
  });
  // Смена суток по Ташкенту, пока вкладка была в фоне: подписи Сегодня и Вчера,
  // даты списаний и границы текущего месяца пересчитываются при возвращении
  let lastDay = todayISO();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (state.session && navigator.onLine !== false) {
      if (!sync.connected) startRealtime();
      if (Date.now() - sync.lastLoaded > 5 * 60 * 1000) void requestRefresh();
    }
    const d = todayISO();
    if (d !== lastDay) { lastDay = d; if (state.session && !state.loading) renderAll(); }
  });
}

/* =====================================================================
   15. ЗАПУСК
   ===================================================================== */
function configOk() {
  return /^https:\/\/.+/.test(SUPABASE_URL) && !SUPABASE_URL.includes('PASTE') && SUPABASE_ANON_KEY.length > 20 && !SUPABASE_ANON_KEY.includes('PASTE');
}
async function boot() {
  let stored = null, storedLang = null;
  try { stored = localStorage.getItem(THEME_KEY); storedLang = localStorage.getItem(LANG_KEY); } catch (e) { /* недоступно */ }
  $('#btn-refresh').innerHTML = icon('refresh'); $('#fab').innerHTML = icon('plus');
  applyLang(storedLang === 'en' ? 'en' : 'ru', { persist: false });
  applyTheme(stored === 'light' ? 'light' : 'dark', { persist: false });
  bindGlobalHandlers(); bindPwa();
  const warn = $('#config-warning');
  if (!window.supabase || !window.Chart) {
    showAuth(); warn.hidden = false; warn.textContent = t('err.cdn'); $('#login-submit').disabled = true; return;
  }
  if (!configOk()) {
    showAuth(); warn.hidden = false; warn.textContent = t('err.config'); $('#login-submit').disabled = true; return;
  }
  // Тот же ключ, что использует Supabase по умолчанию. Здесь хранятся только данные сессии.
  const storageKey = `sb-${new URL(SUPABASE_URL).hostname.split('.')[0]}-auth-token`;
  const savedSession = offlineSession(storageKey);
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storageKey, autoRefreshToken: navigator.onLine !== false },
    global: { fetch: supabaseFetch },
  });
  sb.auth.onAuthStateChange((event, session) => {
    // Никаких await Supabase в auth callback: SDK держит блокировку сессии.
    if (event === 'SIGNED_OUT' && !sync.signingOut) suspendSession();
    if (event === 'TOKEN_REFRESHED' && session && state.session?.user.id === session.user.id) {
      state.session = session;
      if (!sync.connected) setTimeout(startRealtime, 0);
    }
  });
  try {
    // Просроченный токен не мешает читать свой снимок без сети. Серверные записи
    // доступны только после восстановления соединения и проверки сессии Supabase.
    if (navigator.onLine === false) {
      if (savedSession) await enterApp(savedSession);
      else { showAuth(); warn.hidden = false; warn.textContent = t('pwa.offlineEmpty'); }
      return;
    }
    const { data: { session }, error } = await sb.auth.getSession();
    if (error) throw error;
    if (session) await enterApp(session); else showAuth();
  } catch (e) {
    if (pwa.offline && savedSession) await enterApp(savedSession);
    else { showAuth(); toast(errMsg(e), 'err'); }
  }
}
boot();
</script>
