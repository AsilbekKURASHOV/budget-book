  Chart.defaults.plugins.tooltip.bodyFont = { size: 13, weight: 500 };
  // Уважение к prefers-reduced-motion: диаграммы без анимации
  Chart.defaults.animation.duration = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 300;
  Chart.defaults.animation.easing = 'easeOutQuart';
}

// Кольцевая диаграмма расходов по категориям и легенда с суммами и процентами
function updateDonut(txs) {
  const canvas = $('#chart-donut'); if (!canvas || !window.Chart) return;
  const spent = spentByCategory(txs);
  const rows = [...spent.entries()].map(([id, sum]) => ({ cat: catById(id), sum })).filter((r) => r.cat && r.sum > 0).sort((a, b) => b.sum - a.sum);
  const total = sumBy(rows, (r) => r.sum);
  $('#donut-total').textContent = total > 0 ? fmtCompact(total) : '0';
  $('#donut-legend').innerHTML = rows.length
    ? rows.map((r) => `<div class="legend-row" role="listitem" style="--c:${esc(r.cat.color)}"><i aria-hidden="true"></i><span class="ellipsis name" title="${esc(r.cat.name)}">${esc(r.cat.name)}</span><span class="amt"><span class="legend-money">${fmtUZSHtml(r.sum)}</span><b class="legend-share">${fmtPct(r.sum / total * 100, 1)}</b></span></div>`).join('')
    : `<p class="muted small">${esc(t('dash.noExpenses'))}</p>`;
  const labels = rows.length ? rows.map((r) => r.cat.name) : [t('dash.noExpensesLabel')];
  const data = rows.length ? rows.map((r) => r.sum) : [1];
  const colors = rows.length ? rows.map((r) => r.cat.color) : [cssVar('--chart-empty')];
  const ch = state.charts.donut;
  if (ch) {
    ch.data.labels = labels; ch.data.datasets[0].data = data; ch.data.datasets[0].backgroundColor = colors; ch.options.plugins.tooltip.enabled = rows.length > 0; ch.$empty = !rows.length; ch.update();
    return;
  }
  state.charts.donut = new Chart(canvas, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0, borderRadius: 5, spacing: 3, hoverOffset: 8 }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '74%', layout: { padding: 4 },
      plugins: { legend: { display: false }, tooltip: { enabled: rows.length > 0, callbacks: { label: (c) => { const total2 = c.dataset.data.reduce((a, b) => a + b, 0); return ` ${fmtUZS(c.parsed)} (${fmtPct(c.parsed / total2 * 100, 1)})`; } } } },
    },
  });
  state.charts.donut.$empty = !rows.length;
}

// Столбцы доходов и расходов за 6 месяцев, заканчивая месяцем выбранного периода
function updateBars() {
  const canvas = $('#chart-bars'); if (!canvas || !window.Chart) return;
  const { to } = periodRange();
  const end = parseISO(to);
  const months = [];
  for (let i = 5; i >= 0; i--) { const { y, m } = addMonths(end.y, end.m, -i); months.push({ y, m, key: `${y}-${pad2(m)}` }); }
  const inc = months.map(() => 0), exp = months.map(() => 0);
  for (const t of state.transactions) {
    const idx = months.findIndex((mm) => mm.key === monthKey(t.occurred_on));
    if (idx < 0) continue;
    if (t.type === 'income') inc[idx] += Math.round(t.amount_uzs * 100); else exp[idx] += Math.round(t.amount_uzs * 100);
  }
  const nowY = parseISO(todayISO()).y;
  const labels = months.map((mm) => tList('date.monthsShort')[mm.m - 1] + (mm.y !== nowY ? ` ${String(mm.y).slice(2)}` : ''));
  const dInc = inc.map((v) => v / 100), dExp = exp.map((v) => v / 100);
  const pos = cssVar('--pos'), neg = cssVar('--neg');
  const ch = state.charts.bars;
  if (ch) { ch.data.labels = labels; ch.data.datasets[0].data = dInc; ch.data.datasets[1].data = dExp; ch.update(); return; }
  state.charts.bars = new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: [
      { label: t('common.income'), data: dInc, backgroundColor: pos, borderRadius: 7, borderSkipped: false, maxBarThickness: 22 },
      { label: t('common.expenses'), data: dExp, backgroundColor: neg, borderRadius: 7, borderSkipped: false, maxBarThickness: 22 },
    ] },
    options: {
      responsive: true, maintainAspectRatio: false,
      categoryPercentage: 0.68, barPercentage: 0.86,
      scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { callback: (v) => fmtCompact(v), maxTicksLimit: 5 } } },
      plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${fmtUZS(c.parsed.y)}` } } },
    },
  });
}

// Линия накопленных расходов по дням рядом с равномерным планом
function updateLine(txs, from, to) {
  const canvas = $('#chart-line'); if (!canvas || !window.Chart) return;
  const days = Math.min(daysBetween(from, to) + 1, 366);
  const today = todayISO();
  const labels = [], actual = [], planned = [];
  const perDay = new Map();
  for (const t of txs) if (t.type === 'expense') perDay.set(t.occurred_on, (perDay.get(t.occurred_on) || 0) + Math.round(t.amount_uzs * 100));
  const plan = monthlyPlan();
  let accA = 0, accP = 0;
  for (let i = 0; i < days; i++) {
    const iso = addDays(from, i);
    const { y, m, d } = parseISO(iso);
    labels.push(days > 31 ? `${pad2(d)}.${pad2(m)}` : String(d));
    accP += plan / daysInMonth(y, m);
    planned.push(Math.round(accP));
    if (iso <= today) { accA += perDay.get(iso) || 0; actual.push(accA / 100); } else actual.push(null);
  }
  $('#line-sub').textContent = plan > 0 ? t('dash.planMonth', { sum: fmtUZS(plan) }) : t('dash.planHint');
  const accent = cssVar('--neg') || '#FF7A88', muted = cssVar('--text-3');
  // Заливка под линией: вертикальный градиент от акцента к прозрачному,
  // задан функцией, поэтому пересчитывается при смене темы и размера
  const areaFill = (context) => {
    const chart = context.chart;
    const area = chart.chartArea;
    if (!area) return 'transparent';
    const color = cssVar('--neg') || '#FF7A88';
    const g = chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
    g.addColorStop(0, hexToRgba(color, 0.28));
    g.addColorStop(1, hexToRgba(color, 0));
    return g;
  };
  // Точка на последнем известном дне: обрыв заливки читается как отметка сегодня, а не как обрезанные данные
  const lastPoint = (context) => {
    const d = context.dataset.data;
    let last = -1;
    for (let i = 0; i < d.length; i++) if (d[i] != null) last = i;
    return context.dataIndex === last ? 4 : 0;
  };
  const ch = state.charts.line;
  if (ch) { ch.data.labels = labels; ch.data.datasets[0].data = actual; ch.data.datasets[1].data = planned; ch.update(); return; }
  state.charts.line = new Chart(canvas, {

// Таблица лимитов: лимит, потрачено, остаток, прогресс с предупреждением при 80 % и 100 %
function renderLimits(txs, isMonth) {
  const spent = spentByCategory(txs);
  const cats = state.categories.filter((c) => c.type === 'expense' && (c.is_active || (spent.get(c.id) || 0) > 0))
    .sort((a, b) => a.sort_order - b.sort_order || a.name.localeCompare(b.name, 'ru'));
  const host = $('#limits');
  if (!cats.length) { host.innerHTML = `<p class="muted small">${esc(t('dash.noActiveCats'))}</p>`; return; }
  host.innerHTML = cats.map((c) => {
    const sp = spent.get(c.id) || 0;
    const lim = c.monthly_limit;
    let bar = '', sub = '', rest = '';
    if (lim && lim > 0) {
      const pct = sp / lim * 100;
      const cls = pct >= 100 ? 'w100' : pct >= 80 ? 'w80' : '';
      bar = `<div class="progress ${cls}" style="--c:${esc(c.color)}" role="progressbar" aria-valuenow="${Math.min(100, Math.max(0, Math.round(pct)))}" aria-valuetext="${esc(fmtPct(pct, 0))}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(t('dash.limitAria', { name: c.name, pct: fmtPct(pct, 0) }))}"><i style="width:${Math.min(100, pct)}%"></i></div>`;
      sub = t('dash.limit', { sum: fmtUZS(lim) }) + (isMonth ? '' : ' ' + t('dash.perMonth'));
      const left = round2(lim - sp);
      if (pct >= 100) rest = `<span class="neg">${esc(t('dash.overspent', { sum: fmtUZS(Math.max(0, -left)) }))}</span>`;
      else if (pct >= 80) rest = `<span class="warn">${esc(t('dash.left', { sum: fmtUZS(left) }))}</span>`;
      else rest = `<span>${esc(t('dash.remaining', { sum: fmtUZS(left) }))}</span>`;
      sub += ` · ${fmtPct(pct, 0)}`;
    } else { sub = t('dash.noLimit'); rest = `<span>${c.is_active ? '' : esc(t('dash.hiddenCat'))}</span>`; }
    return `<div class="limit-row"><div class="limit-top"><div class="cat-icon sm" style="--c:${esc(c.color)}">${icon(c.icon)}</div><div class="grow"><div class="ellipsis limit-name">${esc(c.name)}</div><div class="small muted">${sub}</div></div><div class="limit-nums"><b>${fmtUZSHtml(sp)}</b>${rest}</div></div>${bar}</div>`;
  }).join('');
}

// Дневной бюджет и прогноз: две карточки только для текущего месяца
function updateDaily(txs, isMonth) {
  const host = $('#dash-daily');
  const today = parseISO(todayISO());
  const p = state.period;
  const isCurrent = isMonth && p.y === today.y && p.m === today.m;
  host.hidden = !isCurrent;
  if (!isCurrent) return;
  const plan = monthlyPlan();
  const { expense } = totals(txs);
  const b = dailyBudget(plan, expense, today.y, today.m, today.d);
  const dailyCard = $('#daily-card'), fcCard = $('#forecast-card');
  const setState = (card, st) => { card.className = 'card stat' + (st ? ' state-' + st : ''); };
  if (plan > 0) {
    const daysText = `${b.remaining} ${pluralWord('plural.day', b.remaining)}`;
    setState(dailyCard, planState((b.evenDaily - b.allowed) / b.evenDaily * 100));
    if (b.left > 0) {
      $('#st-daily').innerHTML = fmtUZSHtml(Math.max(0, b.allowed));
      $('#st-daily-sub').textContent = t('dash.dailySub', { sum: fmtUZS(b.left), days: daysText });
    } else {
      $('#st-daily').innerHTML = fmtUZSHtml(0);
      $('#st-daily-sub').textContent = t('dash.dailyOver', { sum: fmtUZS(-b.left) });
    }
    const dev = (b.forecast - plan) / plan * 100;
    setState(fcCard, planState(dev));
    $('#st-forecast').innerHTML = fmtUZSHtml(b.forecast);
    const cmp = Math.abs(dev) < 0.5 ? t('dash.forecastEqual') : dev > 0 ? t('dash.forecastOver', { pct: fmtPct(dev, 0) }) : t('dash.forecastUnder', { pct: fmtPct(-dev, 0) });
    $('#st-forecast-sub').textContent = `${t('dash.plan', { sum: fmtUZS(plan) })} · ${cmp}`;
  } else {
    setState(dailyCard, ''); setState(fcCard, '');
    $('#st-daily').innerHTML = `<span class="plain-text">${esc(t('dash.noPlan'))}</span>`;
    $('#st-daily-sub').textContent = t('dash.planHint');
    $('#st-forecast').innerHTML = fmtUZSHtml(b.forecast);
    $('#st-forecast-sub').textContent = t('dash.planHint');
  }
}

// Границы периода для фильтра списка
function filterRange() {
  const f = state.filters, t = parseISO(todayISO());
  switch (f.preset) {
    case 'month': return { from: toISO(t.y, t.m, 1), to: toISO(t.y, t.m, daysInMonth(t.y, t.m)) };
    case 'prev': { const p = addMonths(t.y, t.m, -1); return { from: toISO(p.y, p.m, 1), to: toISO(p.y, p.m, daysInMonth(p.y, p.m)) }; }
    case '3m': { const p = addMonths(t.y, t.m, -2); return { from: toISO(p.y, p.m, 1), to: toISO(t.y, t.m, daysInMonth(t.y, t.m)) }; }
    case 'year': return { from: toISO(t.y, 1, 1), to: toISO(t.y, 12, 31) };
    case 'custom': return { from: isValidISO(f.from) ? f.from : '2000-01-01', to: isValidISO(f.to) ? f.to : '2100-12-31' };
    default: return { from: '2000-01-01', to: '2100-12-31' };
  }
}

      <div class="field"><label for="f-cat">${esc(t('tx.category'))}</label><select class="input" id="f-cat">${catOptions}</select></div>

      <div class="field" id="f-custom-from" hidden><label for="f-from">${esc(t('common.from'))}</label><input type="date" class="input" id="f-from" value="${f.from}"></div>

  </div>
  <div class="card" id="tx-list"></div>`;
}
function filteredTransactions() {
  const f = state.filters;
  const { from, to } = filterRange();
  const q = f.query.trim().toLowerCase();
  let list = state.transactions.filter((t) => t.occurred_on >= from && t.occurred_on <= to
    && (f.type === 'all' || t.type === f.type)
    && (!f.categoryId || t.category_id === f.categoryId));
  if (q) list = list.filter((t) => {
    const c = catById(t.category_id), s = subcatById(t.subcategory_id);
    return (t.note || '').toLowerCase().includes(q) || (c && c.name.toLowerCase().includes(q)) || (s && s.name.toLowerCase().includes(q));
  });
  const cmp = {
    date_desc: (a, b) => b.occurred_on.localeCompare(a.occurred_on) || String(b.created_at).localeCompare(String(a.created_at)),
    date_asc: (a, b) => a.occurred_on.localeCompare(b.occurred_on) || String(a.created_at).localeCompare(String(b.created_at)),
    amount_desc: (a, b) => b.amount_uzs - a.amount_uzs,
    amount_asc: (a, b) => a.amount_uzs - b.amount_uzs,
  }[f.sort] || ((a, b) => 0);
  return list.sort(cmp);
}
function txRow(tx, withDate = false) {
  const c = catById(tx.category_id) || { name: t('common.noCategory'), color: '#94A3B8', icon: 'tag' };
  const s = subcatById(tx.subcategory_id);

  const title = s ? s.name : c.name;
  const sub = [withDate ? fmtDate(tx.occurred_on) : '', s ? c.name : '', tx.note].filter(Boolean).join(' · ');
  const usd = tx.currency === 'USD' ? `<span>${fmtUSD(tx.amount_original)} ${esc(t('common.atRate', { rate: fmtNum(tx.rate, { maxFrac: 2 }) }))}</span>` : '';
  return `<button class="list-item" type="button" data-action="edit-tx" data-id="${tx.id}" aria-label="${esc(title)}, ${esc(fmtSignedUZS(tx.amount_uzs, tx.type))}, ${esc(fmtDate(tx.occurred_on))}">

function renderTransactions() {
  const el = $('#panel-transactions');
  if (state.loading) { el.innerHTML = skeletonList(); state.txBuilt = false; return; }
  if (!state.txBuilt) {
    el.innerHTML = filtersShell();

    $('#f-preset').value = f.preset; $('#f-type').value = f.type; $('#f-cat').value = f.categoryId; $('#f-sort').value = f.sort;
    const apply = () => {
      f.preset = $('#f-preset').value; f.type = $('#f-type').value; f.categoryId = $('#f-cat').value; f.sort = $('#f-sort').value;
      // Диапазон дат: некорректный ввод не принимается, поля возвращаются к последним

}

// Строка правила: иконка категории, название и периодичность, сумма и дата, кнопки изменить и провести

<script>
'use strict';
/* =====================================================================
   9. РЕНДЕР: калькулятор и процентный помощник
   ===================================================================== */
const OP_SYMBOL = { '+': '+', '-': '-', '*': '×', '/': '÷' };
function calcFmt(n) {
  if (!Number.isFinite(n)) return t('calc.error');
  const v = Number(n.toPrecision(12));
  return fmtNum(v, { maxFrac: 6, dec: ',' });
}
// Значение для внутреннего поля display: без разрядов, с запятой; 'ERR' это служебная метка ошибки
function calcRaw(n) {
  if (!Number.isFinite(n)) return 'ERR';
  const v = Number(n.toPrecision(12));
  return v.toFixed(6).replace(/\.?0+$/, '').replace('.', ',');
}
function calcApply(a, op, b) {
  switch (op) { case '+': return a + b; case '-': return a - b; case '*': return a * b; case '/': return b === 0 ? NaN : a / b; }
  return b;
}
// Обработка нажатий клавиш обычного калькулятора (логика как у карманного калькулятора)
function calcInput(key) {
  const c = state.calc;
  const cur = () => Number(c.display.replace(',', '.'));
  if (/^[0-9]$/.test(key)) {
    if (c.waiting || c.evaluated || c.display === '0' || c.display === 'ERR') { c.display = key; c.waiting = false; if (c.evaluated) { c.expr = ''; c.evaluated = false; } }
    else if (c.display.replace(/[^0-9]/g, '').length < 15) c.display += key;
  } else if (key === '.') {
    if (c.waiting || c.evaluated) { c.display = '0,'; c.waiting = false; if (c.evaluated) { c.expr = ''; c.evaluated = false; } }
    else if (!c.display.includes(',')) c.display += ',';
  } else if (key === 'C') {
    Object.assign(c, { display: '0', prev: null, op: null, waiting: false, evaluated: false, expr: '' });
  } else if (key === 'back') {
    if (c.evaluated || c.waiting) return;
    c.display = c.display.length > 1 ? c.display.slice(0, -1) : '0';
    if (c.display === '-') c.display = '0';
  } else if (key === 'neg') {
    if (c.display !== '0') c.display = c.display.startsWith('-') ? c.display.slice(1) : '-' + c.display;
  } else if (['+', '-', '*', '/'].includes(key)) {
    if (c.op !== null && !c.waiting) { const r = calcApply(c.prev, c.op, cur()); c.prev = r; c.display = calcRaw(r); }
    else c.prev = cur();
    c.op = key; c.waiting = true; c.evaluated = false;
    c.expr = `${calcFmt(c.prev)} ${OP_SYMBOL[key]}`;
  } else if (key === '%') {
    const v = cur();
    const r = (c.op === '+' || c.op === '-') && c.prev !== null ? c.prev * v / 100 : v / 100;
    c.display = calcRaw(r); c.waiting = false;
  } else if (key === '=') {
    if (c.op === null || c.prev === null) return;
    const b = cur();
    const r = calcApply(c.prev, c.op, b);
    const line = `${calcFmt(c.prev)} ${OP_SYMBOL[c.op]} ${calcFmt(b)} = ${calcFmt(r)}`;
    c.history.unshift({ line, result: r }); c.history = c.history.slice(0, 10);
    c.expr = `${calcFmt(c.prev)} ${OP_SYMBOL[c.op]} ${calcFmt(b)} =`;
    c.display = calcRaw(r);
    c.op = null; c.prev = null; c.waiting = false; c.evaluated = true;
  }
  updateCalcDisplay();
}
function calcValue() { const v = Number(state.calc.display.replace(',', '.')); return Number.isFinite(v) ? v : 0; }
function updateCalcDisplay() {
  const c = state.calc;
  $('#calc-expr').textContent = c.expr;
  const d = c.display;
  let shown;
  if (d === 'ERR') shown = t('calc.error');
  else { const neg = d.startsWith('-') ? '-' : ''; const [i, f] = d.replace('-', '').split(','); shown = neg + groupInt(i || '0') + (f !== undefined ? ',' + f : ''); }
  const valueEl = $('#calc-value');
  valueEl.textContent = shown;
  const isErr = d === 'ERR';
  valueEl.classList.toggle('err', isErr);
  valueEl.classList.toggle('long', !isErr && shown.length > 11 && shown.length <= 16);
  valueEl.classList.toggle('xlong', !isErr && shown.length > 16);
  $('#calc-history').innerHTML = c.history.length
    ? c.history.map((h, i) => `<button type="button" data-action="calc-hist" data-i="${i}"><span>${esc(h.line.split(' = ')[0])}</span><b>= ${esc(calcFmt(h.result))}</b></button>`).join('')
    : `<div class="empty hist-empty"><div class="empty-mark" aria-hidden="true">${icon('inbox')}</div><p>${esc(t('calc.historyEmpty'))}</p></div>`;
}
function calculatorShell() {
  const keys = [
    ['C', 'fn', 'C'], ['back', 'fn', '⌫'], ['%', 'fn', '%'], ['/', 'op', '÷'],
    ['7', '', '7'], ['8', '', '8'], ['9', '', '9'], ['*', 'op', '×'],
    ['4', '', '4'], ['5', '', '5'], ['6', '', '6'], ['-', 'op', '\u2212'],
    ['1', '', '1'], ['2', '', '2'], ['3', '', '3'], ['+', 'op', '+'],
    ['neg', 'fn', '±'], ['0', '', '0'], ['.', '', ','], ['=', 'eq', '='],
  ];
  const labels = { C: t('calc.key.clear'), back: t('calc.key.back'), '%': t('calc.key.pct'), '/': t('calc.key.div'), '*': t('calc.key.mul'), '-': t('calc.key.sub'), '+': t('calc.key.add'), neg: t('calc.key.neg'), '.': t('calc.key.dec'), '=': t('calc.key.eq') };
  return `<div class="seg" id="calc-mode-seg" role="group" aria-label="${esc(t('title.calculator'))}">
    <button type="button" data-action="calc-mode" data-mode="std" aria-pressed="true">${esc(t('calc.tab'))}</button>
    <button type="button" data-action="calc-mode" data-mode="pct" aria-pressed="false">${esc(t('calc.pctTab'))}</button></div>
  <div id="calc-std" class="calc-wrap">
    <div class="card">
      <div class="calc-display" aria-live="polite"><div class="calc-expr" id="calc-expr"></div><div class="calc-value" id="calc-value">0</div></div>
      <div class="keypad">${keys.map(([k, cls, label]) => `<button class="key ${cls}" type="button" data-action="calc-key" data-key="${k}" aria-label="${esc(labels[k] || label)}">${label}</button>`).join('')}</div>
      <button class="btn btn-primary btn-block calc-insert" type="button" data-action="calc-insert">${icon('plus')}<span>${esc(t('calc.insert'))}</span></button>
    </div>
    <div class="card"><div class="card-head"><h3 class="card-title">${esc(t('calc.history'))}</h3><button class="btn btn-sm btn-ghost" type="button" data-action="calc-clear-history">${esc(t('calc.clear'))}</button></div><div class="calc-history" id="calc-history"></div></div>
  </div>
  <div id="calc-pct" class="calc-wrap" hidden>
    <div class="card stack">
      <div class="seg compact" id="pct-mode-seg" role="group" aria-label="${esc(t('calc.pctTab'))}">
        <button type="button" data-action="pct-mode" data-mode="a" aria-pressed="true">${esc(t('pct.modeA'))}</button>
        <button type="button" data-action="pct-mode" data-mode="b" aria-pressed="false">${esc(t('pct.modeB'))}</button>
        <button type="button" data-action="pct-mode" data-mode="c" aria-pressed="false">${esc(t('pct.modeC'))}</button></div>
      <div class="form-grid">
        <div class="field"><label for="pct-x" id="pct-x-label">${esc(t('pct.xPercent'))}</label><input class="input" id="pct-x" inputmode="decimal" placeholder="15" autocomplete="off"></div>
        <div class="field"><label for="pct-y" id="pct-y-label">${esc(t('pct.yNumber'))}</label><input class="input" id="pct-y" inputmode="decimal" placeholder="11 000 000" autocomplete="off"></div>
      </div>
      <div class="seg compact" id="pct-dir-seg" role="group" aria-label="${esc(t('pct.modeC'))}" hidden>
        <button type="button" data-action="pct-dir" data-dir="inc" aria-pressed="true">${esc(t('pct.inc'))}</button>
        <button type="button" data-action="pct-dir" data-dir="dec" aria-pressed="false">${esc(t('pct.dec'))}</button></div>
      <div class="pct-result" aria-live="polite" aria-atomic="true"><b id="pct-result">0</b><span id="pct-formula">${esc(t('pct.enter'))}</span></div>
      <button class="btn btn-primary btn-block" type="button" data-action="pct-insert">${icon('plus')}<span>${esc(t('calc.insert'))}</span></button>
    </div>
    <div class="card stack">
      <h3 class="card-title">${esc(t('pct.presets'))}</h3>
      <p class="small muted" id="pct-period-note"></p>
      <div class="presets">
        <div class="preset-row"><select class="input" id="pct-preset-cat" aria-label="${esc(t('pct.catAria'))}"></select><button class="btn" type="button" data-action="pct-preset-cat">${esc(t('pct.shareBtn'))}</button></div>
        <button class="btn" type="button" data-action="pct-preset-income">${esc(t('pct.incomeShareBtn'))}</button>
      </div>
    </div>
  </div>`;
}
function renderCalculator() {
  const el = $('#panel-calculator');
  if (!state.calcBuilt) {
    el.innerHTML = calculatorShell();
    state.calcBuilt = true;
    $('#pct-x').addEventListener('input', (e) => { state.pct.x = e.target.value; updatePct(); });
    $('#pct-y').addEventListener('input', (e) => { state.pct.y = e.target.value; updatePct(); });
    updateCalcDisplay();
    $('#pct-x').value = state.pct.x;
    $('#pct-y').value = state.pct.y;

    $$('#pct-dir-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.dir === state.pct.dir)));
    setCalcMode(state.calcMode);
  }
  const { label } = periodRange();
  $('#pct-period-note').textContent = t('pct.periodNote', { label });
  const sel = $('#pct-preset-cat');
  const cur = sel.value;
  sel.innerHTML = activeCats('expense').map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  if (cur) sel.value = cur;
  updatePct();
}
function setCalcMode(mode) {
  state.calcMode = mode === 'pct' ? 'pct' : 'std';
  $$('#calc-mode-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === state.calcMode)));
  $('#calc-std').hidden = state.calcMode !== 'std';
  $('#calc-pct').hidden = state.calcMode !== 'pct';
}
function setPctMode(mode) {
  state.pct.mode = mode;
  $$('#pct-mode-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  $('#pct-dir-seg').hidden = mode !== 'c';
  $('#pct-x-label').textContent = mode === 'b' ? t('pct.xPart') : t('pct.xPercent');
  $('#pct-y-label').textContent = mode === 'b' ? t('pct.yTotal') : t('pct.yNumber');
  updatePct();
}
// Процентный помощник: три режима с формулой
function pctCompute() {
  const p = state.pct;
  const x = parseAmount(p.x), y = parseAmount(p.y);
  if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
  if (p.mode === 'a') return { value: y * x / 100, text: t('pct.formulaA', { x: fmtNum(x), y: fmtNum(y), r: fmtNum(y * x / 100) }), isPct: false };
  if (p.mode === 'b') { if (y === 0) return null; const r = x / y * 100; return { value: r, text: t('pct.formulaB', { x: fmtNum(x), p: fmtPct(r, 2), y: fmtNum(y) }), isPct: true }; }
  const k = p.dir === 'inc' ? 1 + x / 100 : 1 - x / 100;
  return { value: y * k, text: t('pct.formulaC', { y: fmtNum(y), sign: p.dir === 'inc' ? '+' : '-', x: fmtNum(x), r: fmtNum(y * k) }), isPct: false };
}
function updatePct() {
  if (!state.calcBuilt) return;
  const r = pctCompute();
  $('#pct-result').textContent = r ? (r.isPct ? fmtPct(r.value, 2) : fmtNum(r.value)) : '0';
  $('#pct-formula').textContent = r ? r.text : t('pct.enter');
}

    <div class="settings-row"><div><div class="row-title" id="acc-email"></div><div class="small muted">${esc(t('auth.viaSupabase'))}</div></div><button class="btn" type="button" data-action="logout">${icon('logout')}<span>${esc(t('set.logout'))}</span></button></div>
  </div>`;
}
function renderSettings() {
  const el = $('#panel-settings');
  if (state.loading) { el.innerHTML = skeletonList(); state.settingsBuilt = false; return; }
  if (!state.settingsBuilt) {
    el.innerHTML = settingsShell();
    state.settingsBuilt = true;
    $('#import-file').addEventListener('change', onImportFile);
    $('#set-goal').addEventListener('input', updateGoalHint);
    $('#set-income').addEventListener('input', updateGoalHint);
    fillSettingsForm();
  } else if (!pwa.settingsDirty && !['set-rate', 'set-income', 'set-goal'].includes(document.activeElement?.id)) {
    fillSettingsForm();
  }
  $$('#set-cat-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.type === state.settingsCatType)));
  $$('#theme-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.theme === currentTheme())));
  $$('#lang-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
  $('#acc-email').textContent = state.session?.user?.email || '';
  const count = (n) => fmtNum(n, { maxFrac: 0 });
  $('#data-stats').innerHTML = `<dt>${esc(t('set.stat.tx'))}</dt><dd>${count(state.transactions.length)}</dd><dt>${esc(t('set.stat.cats'))}</dt><dd>${count(state.categories.length)}</dd><dt>${esc(t('set.stat.subcats'))}</dt><dd>${count(state.subcategories.length)}</dd><dt>${esc(t('set.stat.subs'))}</dt><dd>${count(state.subscriptions.length)}</dd>`;
  restoreSettingsDraft(); updateConnectionUI();
  renderCategoryList();
}
function fillSettingsForm() {
  const s = state.settings;
  $('#set-rate').value = fmtNum(s.usd_rate, { maxFrac: 4 });
  $('#set-rate-date').textContent = s.usd_rate_updated_at ? t('set.rateUpdated', { date: fmtDate(s.usd_rate_updated_at) }) : '';
  $('#set-income').value = fmtNum(s.expected_income, { maxFrac: 2 });
  $('#set-goal').value = fmtNum(s.savings_goal_pct, { maxFrac: 2 });

function updateGoalHint() {
  const inc = parseAmount($('#set-income').value), g = parseAmount($('#set-goal').value);
  $('#set-goal-hint').textContent = Number.isFinite(inc) && Number.isFinite(g) ? t('set.goalHint', { sum: fmtUZS(inc * g / 100), rest: fmtUZS(inc * (1 - g / 100)) }) : '';

function renderCategoryList() {
  const type = state.settingsCatType;
  const cats = state.categories.filter((c) => c.type === type).sort((a, b) => Number(b.is_active) - Number(a.is_active) || a.sort_order - b.sort_order || a.name.localeCompare(b.name, 'ru'));
  $('#set-cat-list').innerHTML = cats.length ? cats.map((c) => {
    const subs = subcatsOf(c.id);
    const meta = [type === 'expense' ? (c.monthly_limit ? t('set.limitMeta', { sum: fmtUZS(c.monthly_limit) }) : t('set.noLimitMeta')) : '', subs.length ? `${subs.length} ${pluralWord('plural.subcat', subs.length)}` : ''].filter(Boolean).join(' · ');
    return `<button class="cat-row ${c.is_active ? '' : 'hidden-cat'}" type="button" data-action="edit-cat" data-id="${c.id}">
      <div class="cat-icon" style="--c:${esc(c.color)}">${icon(c.icon)}</div>
      <div class="li-main"><div class="li-title">${esc(c.name)}</div><div class="li-sub">${esc(meta)}</div></div>
      ${c.is_active ? '' : `<span class="badge off">${esc(t('set.hiddenBadge'))}</span>`}${icon('chevR', 'muted')}</button>`;
  }).join('') : emptyState(t('set.noCats'), t('set.catsHint'), t('common.add'), 'add-cat', 'tag');
}

/* =====================================================================

// Лист добавления и редактирования операции. init может содержать поля transactions или { amount, currency }
function openTxSheet(init = {}) {
  const insertId = uid();
  const isEdit = !!init.id;
  const f = {
    id: init.id || null, type: init.type || 'expense', currency: init.currency || 'UZS',
    amount: init.amount_original != null ? String(init.amount_original) : (init.amount != null ? String(init.amount) : ''),
    categoryId: init.category_id || '', subcategoryId: init.subcategory_id || '',
    date: init.occurred_on || todayISO(), note: init.note || '',
    rate: init.rate && init.rate > 0 ? Number(init.rate) : rate(),
  };
  const body = `
    <div class="stack">
      <div class="seg" id="tx-type" role="group" aria-label="${esc(t('tx.typeAria'))}">
        <button type="button" data-type="expense" aria-pressed="${f.type === 'expense'}">${esc(t('common.expense'))}</button>
        <button type="button" data-type="income" aria-pressed="${f.type === 'income'}">${esc(t('common.income'))}</button></div>
      ${isEdit ? '' : `<div class="field" id="tx-tpl-wrap" hidden><span class="label">${esc(t('tx.templates'))}</span><div class="chips" id="tx-tpl" role="group" aria-label="${esc(t('tx.templates'))}"></div></div>`}
      <div class="amount-block">
        <div class="amount-row">
          <input class="input input-amount" id="tx-amount" aria-describedby="tx-hint tx-error" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="${esc(t('tx.amount'))}" value="${esc(f.amount ? fmtNum(parseAmount(f.amount), { maxFrac: 2 }) : '')}">
          <div class="seg compact" id="tx-cur" role="group" aria-label="${esc(t('tx.currency'))}">
            <button type="button" data-cur="UZS" aria-pressed="${f.currency === 'UZS'}">UZS</button>
            <button type="button" data-cur="USD" aria-pressed="${f.currency === 'USD'}">USD</button></div>
        </div>
        <div class="hint" id="tx-hint"></div>
      </div>
      <div class="field"><span class="label">${esc(t('tx.categoryLabel'))}</span><div class="chips" id="tx-cats" role="group" aria-label="${esc(t('tx.categoryLabel'))}"></div></div>
      <div class="field" id="tx-subs-wrap" hidden><span class="label">${esc(t('tx.subcategory'))}</span><div class="chips" id="tx-subs" role="group" aria-label="${esc(t('tx.subcategory'))}"></div></div>
      <div class="form-grid">
        <div class="field"><label for="tx-date">${esc(t('tx.date'))}</label><input type="date" class="input" id="tx-date" value="${f.date}" min="2000-01-01" max="2100-12-31"></div>
        <div class="field"><label for="tx-note">${esc(t('tx.note'))}</label><input class="input" id="tx-note" placeholder="${esc(t('tx.optional'))}" maxlength="200" value="${esc(f.note)}" autocomplete="off"></div>
      </div>
      <p class="error-text" id="tx-error" role="alert" hidden></p>
    </div>`;
  const footer = `${isEdit ? `<button class="btn btn-danger btn-shrink" type="button" id="tx-delete">${icon('trash')}<span>${esc(t('common.delete'))}</span></button>` : ''}<button class="btn btn-primary" type="button" id="tx-save">${isEdit ? esc(t('common.save')) : esc(t('common.add'))}</button>`;
  const m = openModal({ title: isEdit ? t('tx.edit') : t('tx.new'), body, footer });
  const el = m.el;

  const renderCats = () => {
    const cats = activeCats(f.type);
    const cur = catById(f.categoryId);
    if (cur && !cats.some((c) => c.id === cur.id) && cur.type === f.type) cats.push(cur);
    $('#tx-cats', el).innerHTML = cats.map((c) => `<button class="chip" type="button" data-cat="${c.id}" style="--c:${esc(c.color)}" aria-pressed="${f.categoryId === c.id}">${icon(c.icon)}<span>${esc(c.name)}</span></button>`).join('') || `<p class="muted small">${esc(t('tx.noCats'))}</p>`;
    const subs = f.categoryId ? subcatsOf(f.categoryId) : [];
    $('#tx-subs-wrap', el).hidden = !subs.length;
    $('#tx-subs', el).innerHTML = subs.map((s) => `<button class="chip plain" type="button" data-sub="${s.id}" aria-pressed="${f.subcategoryId === s.id}">${esc(s.name)}</button>`).join('');
  };
  const renderHint = () => {
    const v = round2(parseAmount($('#tx-amount', el).value));
    const h = $('#tx-hint', el);
    if (!Number.isFinite(v) || v <= 0) { h.textContent = f.currency === 'USD' ? t('tx.hintUsd', { rate: fmtNum(f.rate, { maxFrac: 2 }) }) : t('tx.hintUzs'); return; }
    h.textContent = f.currency === 'USD' ? `= ${fmtUZS(usdToUzs(v, f.rate))} ${t('common.atRate', { rate: fmtNum(f.rate, { maxFrac: 2 }) })}` : `= ${fmtUSD(uzsToUsd(v, f.rate))} ${t('common.atRate', { rate: fmtNum(f.rate, { maxFrac: 2 }) })}`;
  };
  // Быстрые шаблоны: чипы над полем суммы, только при добавлении новой операции
  let tplList = [];
  const renderTemplates = () => {
    const wrap = $('#tx-tpl-wrap', el); if (!wrap) return;
    tplList = quickTemplates(f.type);
    wrap.hidden = !tplList.length;
    $('#tx-tpl', el).innerHTML = tplList.map((tp, i) => { const c = catById(tp.category_id); const lb = templateLabel(tp); return `<button class="chip" type="button" data-tpl="${i}" style="--c:${esc(c.color)}" aria-label="${esc(lb.name)} ${esc(lb.amount)}">${icon(c.icon)}<span>${esc(lb.name)}</span><b>${esc(lb.amount)}</b></button>`; }).join('');
  };
  renderCats(); renderHint(); renderTemplates();

  $('#tx-type', el).addEventListener('click', (e) => {
    const b = e.target.closest('button[data-type]'); if (!b) return;
    if (f.type !== b.dataset.type) { f.type = b.dataset.type; f.categoryId = ''; f.subcategoryId = ''; }
    $$('#tx-type button', el).forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.type === f.type)));
    renderCats(); renderTemplates();
  });
  const tplHost = $('#tx-tpl', el);
  if (tplHost) tplHost.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tpl]'); if (!b) return;
    const tp = tplList[Number(b.dataset.tpl)]; if (!tp) return;
    f.currency = tp.currency; f.categoryId = tp.category_id; f.subcategoryId = tp.subcategory_id || '';
    const inp = $('#tx-amount', el);
    inp.value = fmtNum(tp.amount, { maxFrac: 2 }); inp.classList.remove('invalid');
    $$('#tx-cur button', el).forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.cur === f.currency)));
    renderCats(); renderHint();
  });
  $('#tx-cur', el).addEventListener('click', (e) => {
    const b = e.target.closest('button[data-cur]'); if (!b) return;
    const inp = $('#tx-amount', el); const v = parseAmount(inp.value);
    if (f.currency !== b.dataset.cur && Number.isFinite(v) && v > 0) {
      // Мгновенный пересчёт суммы при смене валюты
      inp.value = b.dataset.cur === 'USD' ? fmtNum(uzsToUsd(v, f.rate), { maxFrac: 2 }) : fmtNum(usdToUzs(v, f.rate), { maxFrac: 2 });
    }
    f.currency = b.dataset.cur;
    $$('#tx-cur button', el).forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.cur === f.currency)));
    renderHint();
  });
  $('#tx-amount', el).addEventListener('input', renderHint);
  $('#tx-amount', el).addEventListener('blur', (e) => { const v = parseAmount(e.target.value); if (Number.isFinite(v) && v > 0) e.target.value = fmtNum(v, { maxFrac: 2 }); });
  $('#tx-cats', el).addEventListener('click', (e) => {
    const b = e.target.closest('button[data-cat]'); if (!b) return;
    f.categoryId = b.dataset.cat; f.subcategoryId = '';
    renderCats();
  });
  $('#tx-subs', el).addEventListener('click', (e) => {
    const b = e.target.closest('button[data-sub]'); if (!b) return;
    f.subcategoryId = f.subcategoryId === b.dataset.sub ? '' : b.dataset.sub;
    $$('#tx-subs button', el).forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.sub === f.subcategoryId)));
  });
  const showErr = (msg) => { const p = $('#tx-error', el); p.textContent = msg; p.hidden = !msg; };
  $('#tx-save', el).addEventListener('click', async () => {
    if ($('#tx-save', el).disabled) return;
    const amount = round2(parseAmount($('#tx-amount', el).value));
    const date = $('#tx-date', el).value;
    const note = $('#tx-note', el).value.trim();
    $('#tx-amount', el).classList.toggle('invalid', !(Number.isFinite(amount) && amount > 0));
    $('#tx-amount', el).setAttribute('aria-invalid', String(!(Number.isFinite(amount) && amount > 0)));
    if (!Number.isFinite(amount) || amount <= 0) return showErr(t('form.errAmount'));
    if (!f.categoryId) return showErr(t('form.errCat'));
    if (!isValidISO(date)) return showErr(t('form.errDate'));
    showErr('');
    const row = {
      type: f.type, currency: f.currency,
      amount_original: round2(amount),
      amount_uzs: f.currency === 'USD' ? usdToUzs(amount, f.rate) : round2(amount),
      rate: f.rate, category_id: f.categoryId, subcategory_id: f.subcategoryId || null, note, occurred_on: date,
    };
    const btn = $('#tx-save', el); btn.disabled = true;
    try {
      if (isEdit) {
        const saved = normTx(await db.update('transactions', f.id, row));
        toast(t('tx.updated'));
      } else {
        const saved = normTx(await db.insert('transactions', { ...row, id: insertId }));
        toast(t('tx.added', { type: f.type === 'income' ? t('common.income') : t('common.expense'), sum: fmtUZS(saved.amount_uzs) }));
      }
      m.close();
      afterDataChange();
    } catch (e) { showErr(errMsg(e)); toast(errMsg(e), 'err'); btn.disabled = false; }
  });
  if (isEdit) $('#tx-delete', el).addEventListener('click', async () => {
    const btnDel = $('#tx-delete', el);
    if (btnDel.disabled) return;
    const ok = await confirmDialog({ title: t('tx.delTitle'), text: t('tx.delText'), okLabel: t('common.delete'), danger: true });
    if (!ok) return;
    btnDel.disabled = true;
    try {
      await db.remove('transactions', f.id);
      m.close(); toast(t('tx.deleted')); afterDataChange();
    } catch (e) { toast(errMsg(e), 'err'); btnDel.disabled = false; }
  });
}

// Оплата подписки: создаёт расход в нужной категории и подкатегории, обновляет дату последней оплаты
function openPaySheet(sub) {
  const usd0 = subEffectiveUsd(sub);
  const r = rate();
  const body = `<div class="stack">
    <div class="field"><label for="pay-usd">${esc(t('sub.amountUsd'))}</label><input class="input input-amount" id="pay-usd" aria-describedby="pay-hint pay-error" inputmode="decimal" value="${fmtNum(usd0, { maxFrac: 2, dec: '.' })}" autocomplete="off"><div class="hint" id="pay-hint"></div></div>
    <p class="small muted">${esc(sub.usd_min !== sub.usd_max ? t('sub.rangeNote', { min: fmtUSD(sub.usd_min), max: fmtUSD(sub.usd_max) }) : t('sub.fixedNote', { sum: fmtUSD(sub.usd_default) }))}</p>
    <div class="field"><label for="pay-date">${esc(t('sub.payDate'))}</label><input type="date" class="input" id="pay-date" value="${todayISO()}"></div>
    <p class="error-text" id="pay-error" role="alert" hidden></p></div>`;
  const m = openModal({ title: t('sub.payTitle', { name: sub.name }), body, footer: `<button class="btn btn-primary" type="button" id="pay-ok">${esc(t('sub.pay'))}</button>` });
  const el = m.el;
  const hint = () => { const v = round2(parseAmount($('#pay-usd', el).value)); $('#pay-hint', el).textContent = Number.isFinite(v) && v > 0 ? `= ${fmtUZS(usdToUzs(v, r))} ${t('common.atRate', { rate: fmtNum(r, { maxFrac: 2 }) })}` : t('common.rate', { rate: fmtNum(r, { maxFrac: 2 }) }); };
  hint();
  // Запрос и UUID сохраняются при повторе после сетевой ошибки. Запись атомарна в SQL.
  const txId = uid();
  let request = null;
  $('#pay-usd', el).addEventListener('input', hint);
  $('#pay-ok', el).addEventListener('click', async () => {
    if ($('#pay-ok', el).disabled) return;
    const v = round2(parseAmount($('#pay-usd', el).value)); const date = $('#pay-date', el).value;
    const err = $('#pay-error', el);
    if (!Number.isFinite(v) || v <= 0) { err.textContent = t('form.errAmount'); err.hidden = false; return; }
    if (!isValidISO(date)) { err.textContent = t('form.errDate'); err.hidden = false; return; }
    const cat = catById(sub.category_id);
    if (!cat) { err.textContent = t('sub.noCatErr'); err.hidden = false; return; }
    $('#pay-ok', el).disabled = true;
    try {
      if (!request) request = { p_tx_id: txId, p_subscription_id: sub.id,
        p_row: { amount_original: v, rate: r, occurred_on: date } };
      $('#pay-usd', el).disabled = true; $('#pay-date', el).disabled = true;
      const result = await db.postPayment(request);
      const insertedTx = normTx(result.transaction), upd = normSub(result.target);
      m.close(); toast(t('sub.payToast', { name: sub.name, usd: fmtUSD(insertedTx.amount_original), uzs: fmtUZS(insertedTx.amount_uzs) })); afterDataChange();
    } catch (e) { err.textContent = errMsg(e); err.hidden = false; $('#pay-ok', el).disabled = false; }
  });
}

// Добавление и редактирование подписки
function openSubEditor(sub = null) {
  const insertId = uid();
  const isEdit = !!sub;
  // 'Подписки' здесь это имя стартовой категории из supabase.sql (данные из базы, не текст интерфейса)
  const f = sub ? { ...sub } : { name: '', category_id: (state.categories.find((c) => c.type === 'expense' && c.name === 'Подписки') || activeCats('expense')[0] || {}).id || '', subcategory_id: null, usd_min: 0, usd_max: 0, usd_default: 0, billing_day: 1, is_active: true };
  const catOpts = () => activeCats('expense').concat(state.categories.filter((c) => c.type === 'expense' && !c.is_active && c.id === f.category_id)).map((c) => `<option value="${c.id}" ${c.id === f.category_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const subOpts = () => `<option value="">${esc(t('sub.noSubcat'))}</option>` + subcatsOf(f.category_id).map((s) => `<option value="${s.id}" ${s.id === f.subcategory_id ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  const body = `<div class="stack">
    <div class="field"><label for="sub-name">${esc(t('sub.name'))}</label><input class="input" id="sub-name" value="${esc(f.name)}" maxlength="80" placeholder="${esc(t('sub.namePh'))}" autocomplete="off"></div>
    <div class="form-grid">
      <div class="field"><label for="sub-cat">${esc(t('sub.cat'))}</label><select class="input" id="sub-cat">${catOpts()}</select></div>
      <div class="field"><label for="sub-subcat">${esc(t('sub.subcat'))}</label><select class="input" id="sub-subcat">${subOpts()}</select></div>
    </div>
    <div class="form-grid">
      <div class="field"><label for="sub-min">${esc(t('sub.min'))}</label><input class="input" id="sub-min" inputmode="decimal" value="${fmtNum(f.usd_min, { maxFrac: 2, dec: '.' })}"></div>
      <div class="field"><label for="sub-max">${esc(t('sub.max'))}</label><input class="input" id="sub-max" inputmode="decimal" value="${fmtNum(f.usd_max, { maxFrac: 2, dec: '.' })}"></div>
      <div class="field"><label for="sub-def">${esc(t('sub.default'))}</label><input class="input" id="sub-def" inputmode="decimal" value="${fmtNum(f.usd_default, { maxFrac: 2, dec: '.' })}"></div>
      <div class="field"><label for="sub-day">${esc(t('sub.day'))}</label><input class="input" id="sub-day" type="number" min="1" max="31" inputmode="numeric" value="${f.billing_day}"></div>
    </div>
    <div class="settings-row flush"><div><div class="row-title">${esc(t('sub.activeSwitch'))}</div><div class="small muted">${esc(t('sub.activeHint'))}</div></div><button class="switch" type="button" id="sub-active" role="switch" aria-checked="${f.is_active}" aria-label="${esc(t('sub.activeSwitch'))}"></button></div>
    <p class="error-text" id="sub-error" role="alert" hidden></p></div>`;
  const footer = `${isEdit ? `<button class="btn btn-danger btn-shrink" type="button" id="sub-delete">${icon('trash')}<span>${esc(t('common.delete'))}</span></button>` : ''}<button class="btn btn-primary" type="button" id="sub-save">${isEdit ? esc(t('common.save')) : esc(t('common.add'))}</button>`;
  const m = openModal({ title: isEdit ? t('sub.editTitle') : t('sub.new'), body, footer });
  const el = m.el;
  $('#sub-cat', el).addEventListener('change', (e) => { f.category_id = e.target.value; f.subcategory_id = null; $('#sub-subcat', el).innerHTML = subOpts(); });
  $('#sub-active', el).addEventListener('click', (e) => { f.is_active = !f.is_active; e.currentTarget.setAttribute('aria-checked', String(f.is_active)); });
  const showErr = (msg) => { const p = $('#sub-error', el); p.textContent = msg; p.hidden = !msg; };
  $('#sub-save', el).addEventListener('click', async () => {
    if ($('#sub-save', el).disabled) return;
    const name = $('#sub-name', el).value.trim();
    const mn = parseAmount($('#sub-min', el).value), mx = parseAmount($('#sub-max', el).value), df = parseAmount($('#sub-def', el).value);
    const day = Number($('#sub-day', el).value);
    if (!name) return showErr(t('form.errName'));
    if (!$('#sub-cat', el).value) return showErr(t('form.errCat'));
    if (![mn, mx, df].every((v) => Number.isFinite(v) && v >= 0)) return showErr(t('sub.errNums'));
    if (mx < mn) return showErr(t('sub.errRange'));
    if (!Number.isInteger(day) || day < 1 || day > 31) return showErr(t('sub.errDay'));
    showErr('');
    const row = { name, category_id: $('#sub-cat', el).value, subcategory_id: $('#sub-subcat', el).value || null, usd_min: round2(mn), usd_max: round2(mx), usd_default: round2(df), billing_day: day, is_active: f.is_active };
    $('#sub-save', el).disabled = true;
    try {
      if (isEdit) { const saved = normSub(await db.update('subscriptions', sub.id, row)); toast(t('sub.saved')); }
      else { const saved = normSub(await db.insert('subscriptions', { ...row, id: insertId })); toast(t('sub.added')); }
      m.close(); afterDataChange();
    } catch (e) { showErr(errMsg(e)); $('#sub-save', el).disabled = false; }
  });
  if (isEdit) $('#sub-delete', el).addEventListener('click', async () => {
    const btnDel = $('#sub-delete', el);
    if (btnDel.disabled) return;
    const ok = await confirmDialog({ title: t('sub.delTitle'), text: t('sub.delText', { name: sub.name }), okLabel: t('common.delete'), danger: true });
    if (!ok) return;
    btnDel.disabled = true;
    try { await db.remove('subscriptions', sub.id); m.close(); toast(t('sub.deleted')); afterDataChange(); }
    catch (e) { toast(errMsg(e), 'err'); btnDel.disabled = false; }
  });
}

// Добавление и редактирование регулярного правила
function openRuleEditor(rule = null) {
  const insertId = uid();
  const isEdit = !!rule;
  const today = todayISO();
  const f = rule
    ? { ...rule }
    : { name: '', type: 'expense', amount_original: 0, currency: 'UZS', category_id: '', subcategory_id: null, note: '', period: 'monthly', day_of_month: null, day_of_week: null, next_due: today, is_active: true };
  if (!isValidISO(f.next_due)) f.next_due = today;
  if (!(f.day_of_month >= 1 && f.day_of_month <= 31)) f.day_of_month = parseISO(f.next_due).d;
  if (!(f.day_of_week >= 0 && f.day_of_week <= 6)) f.day_of_week = weekdayOf(f.next_due);
  if (!catById(f.category_id)) f.category_id = (activeCats(f.type)[0] || {}).id || '';
  const catOpts = () => activeCats(f.type).concat(state.categories.filter((c) => c.type === f.type && !c.is_active && c.id === f.category_id))
    .map((c) => `<option value="${c.id}" ${c.id === f.category_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const subOpts = () => `<option value="">${esc(t('sub.noSubcat'))}</option>` + subcatsOf(f.category_id).map((s) => `<option value="${s.id}" ${s.id === f.subcategory_id ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  const dowOrder = [1, 2, 3, 4, 5, 6, 0];
  const body = `<div class="stack">
    <div class="seg" id="rule-type" role="group" aria-label="${esc(t('tx.typeAria'))}">
      <button type="button" data-type="expense" aria-pressed="${f.type === 'expense'}">${esc(t('common.expense'))}</button>
      <button type="button" data-type="income" aria-pressed="${f.type === 'income'}">${esc(t('common.income'))}</button></div>
    <div class="field"><label for="rule-name">${esc(t('rule.name'))}</label><input class="input" id="rule-name" value="${esc(f.name)}" maxlength="80" placeholder="${esc(t('rule.namePh'))}" autocomplete="off"></div>
    <div class="amount-block">
      <div class="amount-row">
        <input class="input input-amount" id="rule-amount" aria-describedby="rule-hint rule-error" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="${esc(t('tx.amount'))}" value="${f.amount_original > 0 ? esc(fmtNum(f.amount_original, { maxFrac: 2 })) : ''}">
        <div class="seg compact" id="rule-cur" role="group" aria-label="${esc(t('tx.currency'))}">
          <button type="button" data-cur="UZS" aria-pressed="${f.currency === 'UZS'}">UZS</button>
          <button type="button" data-cur="USD" aria-pressed="${f.currency === 'USD'}">USD</button></div>
      </div>
      <div class="hint" id="rule-hint"></div>
    </div>
    <div class="form-grid">
      <div class="field"><label for="rule-cat">${esc(t('sub.cat'))}</label><select class="input" id="rule-cat">${catOpts()}</select></div>
      <div class="field"><label for="rule-subcat">${esc(t('sub.subcat'))}</label><select class="input" id="rule-subcat">${subOpts()}</select></div>
    </div>
    <div class="field"><span class="label">${esc(t('rule.period'))}</span>
      <div class="seg compact" id="rule-period" role="group" aria-label="${esc(t('rule.period'))}">
        <button type="button" data-period="monthly" aria-pressed="${f.period === 'monthly'}">${esc(t('rule.monthly'))}</button>
        <button type="button" data-period="weekly" aria-pressed="${f.period === 'weekly'}">${esc(t('rule.weekly'))}</button></div></div>
    <div class="form-grid">
      <div class="field" id="rule-dom-wrap" ${f.period === 'monthly' ? '' : 'hidden'}><label for="rule-dom">${esc(t('rule.dayOfMonth'))}</label><input class="input" id="rule-dom" type="number" min="1" max="31" inputmode="numeric" value="${f.day_of_month}"></div>
      <div class="field" id="rule-dow-wrap" ${f.period === 'weekly' ? '' : 'hidden'}><label for="rule-dow">${esc(t('rule.dayOfWeek'))}</label><select class="input" id="rule-dow">${dowOrder.map((d) => `<option value="${d}" ${d === f.day_of_week ? 'selected' : ''}>${esc(tList('date.weekdays')[d])}</option>`).join('')}</select></div>
      <div class="field"><label for="rule-next">${esc(t('rule.nextDue'))}</label><input type="date" class="input" id="rule-next" value="${f.next_due}" min="2000-01-01" max="2100-12-31"></div>
      <div class="field full"><label for="rule-note">${esc(t('tx.note'))}</label><input class="input" id="rule-note" placeholder="${esc(t('tx.optional'))}" maxlength="200" value="${esc(f.note)}" autocomplete="off"></div>
    </div>
    <div class="settings-row flush"><div><div class="row-title">${esc(t('rule.activeSwitch'))}</div><div class="small muted">${esc(t('rule.activeHint'))}</div></div><button class="switch" type="button" id="rule-active" role="switch" aria-checked="${f.is_active}" aria-label="${esc(t('rule.activeSwitch'))}"></button></div>
    <p class="error-text" id="rule-error" role="alert" hidden></p></div>`;
  const footer = `${isEdit ? `<button class="btn btn-danger btn-shrink" type="button" id="rule-delete">${icon('trash')}<span>${esc(t('common.delete'))}</span></button>` : ''}<button class="btn btn-primary" type="button" id="rule-save">${isEdit ? esc(t('common.save')) : esc(t('common.add'))}</button>`;
  const m = openModal({ title: isEdit ? t('rule.editTitle') : t('rule.new'), body, footer });
  const el = m.el;
  const r = rate();
  const renderHint = () => {
    const v = round2(parseAmount($('#rule-amount', el).value));
    const h = $('#rule-hint', el);
    if (!Number.isFinite(v) || v <= 0) { h.textContent = f.currency === 'USD' ? t('tx.hintUsd', { rate: fmtNum(r, { maxFrac: 2 }) }) : t('tx.hintUzs'); return; }
    h.textContent = f.currency === 'USD' ? `= ${fmtUZS(usdToUzs(v, r))} ${t('common.atRate', { rate: fmtNum(r, { maxFrac: 2 }) })}` : `= ${fmtUSD(uzsToUsd(v, r))} ${t('common.atRate', { rate: fmtNum(r, { maxFrac: 2 }) })}`;
  };
  // Дата следующего проведения пересчитывается при смене периодичности и дня; её можно поправить вручную
  const syncNext = () => {
    const dom = Number($('#rule-dom', el).value), dow = Number($('#rule-dow', el).value);
    $('#rule-next', el).value = ruleNextDueFrom(f.period, Number.isInteger(dom) ? dom : null, Number.isInteger(dow) ? dow : null, today);
  };
  renderHint();
  $('#rule-type', el).addEventListener('click', (e) => {
    const b = e.target.closest('button[data-type]'); if (!b) return;
    if (f.type !== b.dataset.type) { f.type = b.dataset.type; f.category_id = (activeCats(f.type)[0] || {}).id || ''; f.subcategory_id = null; $('#rule-cat', el).innerHTML = catOpts(); $('#rule-subcat', el).innerHTML = subOpts(); }
    $$('#rule-type button', el).forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.type === f.type)));
  });
  $('#rule-cur', el).addEventListener('click', (e) => {
    const b = e.target.closest('button[data-cur]'); if (!b) return;
    f.currency = b.dataset.cur;
    $$('#rule-cur button', el).forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.cur === f.currency)));
    renderHint();
  });
  $('#rule-amount', el).addEventListener('input', renderHint);
  $('#rule-amount', el).addEventListener('blur', (e) => { const v = parseAmount(e.target.value); if (Number.isFinite(v) && v > 0) e.target.value = fmtNum(v, { maxFrac: 2 }); });
  $('#rule-cat', el).addEventListener('change', (e) => { f.category_id = e.target.value; f.subcategory_id = null; $('#rule-subcat', el).innerHTML = subOpts(); });
  $('#rule-period', el).addEventListener('click', (e) => {
    const b = e.target.closest('button[data-period]'); if (!b) return;
    f.period = b.dataset.period;
    $$('#rule-period button', el).forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.period === f.period)));
    $('#rule-dom-wrap', el).hidden = f.period !== 'monthly';
    $('#rule-dow-wrap', el).hidden = f.period !== 'weekly';
    syncNext();
  });
  $('#rule-dom', el).addEventListener('input', syncNext);
  $('#rule-dom', el).addEventListener('change', syncNext);
  $('#rule-dow', el).addEventListener('change', syncNext);
  $('#rule-active', el).addEventListener('click', (e) => { f.is_active = !f.is_active; e.currentTarget.setAttribute('aria-checked', String(f.is_active)); });
  const showErr = (msg) => { const p = $('#rule-error', el); p.textContent = msg; p.hidden = !msg; };
  $('#rule-save', el).addEventListener('click', async () => {
    if ($('#rule-save', el).disabled) return;
    const name = $('#rule-name', el).value.trim();
    const amount = round2(parseAmount($('#rule-amount', el).value));
    const dom = Number($('#rule-dom', el).value), dow = Number($('#rule-dow', el).value);
    const nextDue = $('#rule-next', el).value;
    const note = $('#rule-note', el).value.trim();
    if (!name) return showErr(t('form.errName'));
    $('#rule-amount', el).classList.toggle('invalid', !(Number.isFinite(amount) && amount > 0));
    $('#rule-amount', el).setAttribute('aria-invalid', String(!(Number.isFinite(amount) && amount > 0)));
    if (!Number.isFinite(amount) || amount <= 0) return showErr(t('form.errAmount'));
    if (!$('#rule-cat', el).value) return showErr(t('form.errCat'));
    if (f.period === 'monthly' && (!Number.isInteger(dom) || dom < 1 || dom > 31)) return showErr(t('rule.errDay'));
    if (!isValidISO(nextDue)) return showErr(t('rule.errNextDue'));
    showErr('');
    const row = {
      name, type: f.type, amount_original: round2(amount), currency: f.currency,
      category_id: $('#rule-cat', el).value, subcategory_id: $('#rule-subcat', el).value || null, note,
      period: f.period, day_of_month: f.period === 'monthly' ? dom : null, day_of_week: f.period === 'weekly' ? dow : null,
      next_due: nextDue, is_active: f.is_active,
    };
    $('#rule-save', el).disabled = true;
    try {
      if (isEdit) { const saved = normRule(await db.update('recurring_rules', rule.id, row)); toast(t('rule.saved')); }
      else { const saved = normRule(await db.insert('recurring_rules', { ...row, id: insertId })); toast(t('rule.added')); }
      m.close(); afterDataChange();
    } catch (e) { showErr(errMsg(e)); toast(errMsg(e), 'err'); $('#rule-save', el).disabled = false; }
  });
  if (isEdit) $('#rule-delete', el).addEventListener('click', async () => {
    const btnDel = $('#rule-delete', el);
    if (btnDel.disabled) return;
    const ok = await confirmDialog({ title: t('rule.delTitle'), text: t('rule.delText', { name: rule.name }), okLabel: t('common.delete'), danger: true });
    if (!ok) return;
    btnDel.disabled = true;
    try { await db.remove('recurring_rules', rule.id); m.close(); toast(t('rule.deleted')); afterDataChange(); }
    catch (e) { toast(errMsg(e), 'err'); btnDel.disabled = false; }
  });
}

// Проведение правила: создаёт операцию по текущему курсу и сдвигает next_due на следующий период
function openPostRuleSheet(rule) {
  const r = rate();
  const today = todayISO();
  const date0 = isValidISO(rule.next_due) && rule.next_due <= today ? rule.next_due : today;
  const nextAfter = ruleAdvance(rule);
  const isUsd = rule.currency === 'USD';
  const body = `<div class="stack">
    <div class="field"><label for="post-amount">${esc(isUsd ? t('sub.amountUsd') : t('tx.amount'))}</label><input class="input input-amount" id="post-amount" aria-describedby="post-hint post-error" inputmode="decimal" value="${esc(fmtNum(rule.amount_original, { maxFrac: 2 }))}" autocomplete="off"><div class="hint" id="post-hint"></div></div>
    <div class="field"><label for="post-date">${esc(t('rule.postDate'))}</label><input type="date" class="input" id="post-date" value="${date0}" min="2000-01-01" max="2100-12-31"></div>
    <p class="small muted">${esc(t('rule.postNote', { date: fmtDate(nextAfter) }))}</p>
    <p class="error-text" id="post-error" role="alert" hidden></p></div>`;
  const m = openModal({ title: t('rule.postTitle', { name: rule.name }), body, footer: `<button class="btn btn-primary" type="button" id="post-ok">${esc(t('rule.post'))}</button>` });
  const el = m.el;
  const hint = () => {
    const v = round2(parseAmount($('#post-amount', el).value));
    const h = $('#post-hint', el);
    if (!Number.isFinite(v) || v <= 0) { h.textContent = isUsd ? t('tx.hintUsd', { rate: fmtNum(r, { maxFrac: 2 }) }) : t('tx.hintUzs'); return; }
    h.textContent = isUsd ? `= ${fmtUZS(usdToUzs(v, r))} ${t('common.atRate', { rate: fmtNum(r, { maxFrac: 2 }) })}` : `= ${fmtUSD(uzsToUsd(v, r))} ${t('common.atRate', { rate: fmtNum(r, { maxFrac: 2 }) })}`;
  };
  hint();
  $('#post-amount', el).addEventListener('input', hint);
  // SQL блокирует правило и проверяет плановую дату перед вставкой операции.
  const txId = uid();
  let request = null;
  $('#post-ok', el).addEventListener('click', async () => {
    if ($('#post-ok', el).disabled) return;
    const v = round2(parseAmount($('#post-amount', el).value)); const date = $('#post-date', el).value;
    const err = $('#post-error', el);
    const fail = (msg) => { err.textContent = msg; err.hidden = false; };
    if (!Number.isFinite(v) || v <= 0) return fail(t('form.errAmount'));
    if (!isValidISO(date)) return fail(t('form.errDate'));
    if (!catById(rule.category_id)) return fail(t('rule.noCatErr'));
    err.hidden = true;
    $('#post-ok', el).disabled = true;
    try {
      if (!request) request = { p_tx_id: txId, p_rule_id: rule.id, p_expected_due: rule.next_due,
        p_row: { amount_original: v, rate: r, occurred_on: date } };
      $('#post-amount', el).disabled = true; $('#post-date', el).disabled = true;
      const result = await db.postPayment(request);
      const insertedTx = normTx(result.transaction), upd = normRule(result.target);
      m.close(); toast(t('rule.posted', { name: rule.name, sum: fmtUZS(insertedTx.amount_uzs) })); afterDataChange();
    } catch (e) { fail(errMsg(e)); toast(errMsg(e), 'err'); $('#post-ok', el).disabled = false; }
  });
}

function csvNum(n) { const v = Number(n); return (Number.isFinite(v) ? String(v) : '0').replace('.', ','); }

function onImportFile(e) {

// Импорт объединяет данные по id в порядке зависимостей таблиц.
// Записи из другой базы (например, восстановление резервной копии в заново созданный
// проект Supabase) сопоставляются с существующими по уникальным ключам:
// категории по паре тип и имя, подкатегории по паре категория и имя, подписки по имени.
// Без этого upsert по id падал бы на unique-ограничениях и импорт обрывался.
// Все значения приводятся к допустимым для CHECK-ограничений базы, чтобы одна
// испорченная запись в файле не прерывала импорт остальных.
async function importData(d) {
  // Не начинать частичный импорт, если правила из копии невозможно восстановить.
  if (Array.isArray(d.recurring_rules) && d.recurring_rules.length && !state.recurringReady) throw new Error(t('rule.tableMissing'));
  const okId = (v) => typeof v === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
  const num = (v, dflt) => { const n = Number(v); return Number.isFinite(n) ? n : dflt; };
  const arr = (v) => (Array.isArray(v) ? v : []);

  // USD numeric(12,2), sort_order integer; больше значений быть не может
  const MAX_UZS = 1e14, MAX_RATE = 1e10, MAX_USD = 9999999999;
  const clampOrder = (v) => Math.min(1e9, Math.max(-1e9, Math.round(num(v, 0))));

  // Категории: итоговый id либо совпадает с существующим, либо подменяется
  // на id существующей категории с тем же типом и именем
  const catKey = (type, name) => `${type}\u0000${String(name).trim()}`;
  const existingCatByKey = new Map(state.categories.map((c) => [catKey(c.type, c.name), c.id]));
  const existingCatIds = new Set(state.categories.map((c) => c.id));
  const catIdMap = new Map();
  const seenCatIds = new Set(), seenCatKeys = new Set();
  const cats = [];
  for (const raw of arr(d.categories)) {
    if (!raw || typeof raw.name !== 'string' || !raw.name.trim() || !['income', 'expense'].includes(raw.type)) continue;
    const name = raw.name.trim();
    const key = catKey(raw.type, name);
    const srcId = raw.id;
    let id = okId(srcId) ? srcId : uid();
    if (!existingCatIds.has(id) && existingCatByKey.has(key)) id = existingCatByKey.get(key);
    if (srcId != null && id !== srcId) catIdMap.set(srcId, id);
    if (seenCatIds.has(id) || seenCatKeys.has(key)) continue;
    seenCatIds.add(id); seenCatKeys.add(key);
    existingCatByKey.set(key, id);
    const lim = num(raw.monthly_limit, 0);
    cats.push({
      id, name, type: raw.type,
      color: typeof raw.color === 'string' && /^#[0-9A-Fa-f]{6}$/.test(raw.color) ? raw.color.toUpperCase() : '#94A3B8',
      icon: typeof raw.icon === 'string' && raw.icon ? raw.icon : 'tag',
      monthly_limit: raw.type === 'expense' && lim > 0 && lim < MAX_UZS ? round2(lim) : null,
      sort_order: clampOrder(raw.sort_order),
      is_active: raw.is_active !== false,
    });
  }
  const catIds = new Set([...seenCatIds, ...existingCatIds]);
  const mapCat = (v) => (catIdMap.has(v) ? catIdMap.get(v) : v);

  // Подкатегории: сопоставление по паре категория и имя
  const subKey = (categoryId, name) => `${categoryId}\u0000${String(name).trim()}`;
  const existingSubByKey = new Map(state.subcategories.map((s) => [subKey(s.category_id, s.name), s.id]));
  const existingSubIds = new Set(state.subcategories.map((s) => s.id));
  const subIdMap = new Map();
  const seenSubIds = new Set(), seenSubKeys = new Set();
  const subs = [];
  for (const raw of arr(d.subcategories)) {
    if (!raw || typeof raw.name !== 'string' || !raw.name.trim()) continue;
    const categoryId = mapCat(raw.category_id);
    if (!catIds.has(categoryId)) continue;
    const name = raw.name.trim();
    const key = subKey(categoryId, name);
    const srcId = raw.id;
    let id = okId(srcId) ? srcId : uid();
    if (!existingSubIds.has(id) && existingSubByKey.has(key)) id = existingSubByKey.get(key);
    if (srcId != null && id !== srcId) subIdMap.set(srcId, id);
    if (seenSubIds.has(id) || seenSubKeys.has(key)) continue;
    seenSubIds.add(id); seenSubKeys.add(key);
    existingSubByKey.set(key, id);

  }

  const mapSubcat = (v) => (subIdMap.has(v) ? subIdMap.get(v) : v);

  // Подписки: сопоставление по имени (в базе оно уникально)
  const existingSubscByName = new Map(state.subscriptions.map((s) => [s.name.trim(), s.id]));

  const subsc = [];

    const categoryId = mapCat(raw.category_id);
    if (!catIds.has(categoryId)) continue;
    const name = raw.name.trim();
    const srcId = raw.id;
    let id = okId(srcId) ? srcId : uid();
    if (!existingSubscIds.has(id) && existingSubscByName.has(name)) id = existingSubscByName.get(name);
    if (seenSubscIds.has(id) || seenSubscNames.has(name)) continue;
    seenSubscIds.add(id); seenSubscNames.add(name);
    const mn = usdVal(raw.usd_min);
    const mx = Math.max(mn, usdVal(raw.usd_max));
    let day = Math.round(num(raw.billing_day, 1));
    if (day < 1 || day > 31) day = 1;
    const sc = mapSubcat(raw.subcategory_id);

      subcategory_id: sc && subcatIds.has(sc) ? sc : null,

      last_paid_at: isValidISO(raw.last_paid_at) ? raw.last_paid_at : null,
    });
  }

  // Регулярные правила: ссылки на категории и подкатегории переводятся так же, как у подписок
  const seenRuleIds = new Set();
  const rules = [];
  for (const raw of arr(d.recurring_rules)) {
    if (!raw || typeof raw.name !== 'string' || !raw.name.trim() || !['income', 'expense'].includes(raw.type)) continue;
    const categoryId = mapCat(raw.category_id);
    if (!catIds.has(categoryId)) continue;
    const amount = round2(num(raw.amount_original, 0));
    if (!(amount > 0 && amount < MAX_UZS)) continue;
    const id = okId(raw.id) ? raw.id : uid();
    if (seenRuleIds.has(id)) continue;
    seenRuleIds.add(id);
    const period = raw.period === 'weekly' ? 'weekly' : 'monthly';
    const nextDue = isValidISO(raw.next_due) ? raw.next_due : todayISO();
